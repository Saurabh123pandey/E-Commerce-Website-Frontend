<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign-up Form </title>
     <link rel="icon" href="images/icon.png" type="image/x-icon">
    <link rel="stylesheet" href="signupstyle.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css"
        integrity="sha512-KfkfwYDsLkIlwQp6LFnl8zNdLGxu9YAA1QvwINks4PhcElQSvqcyVLLD9aMhXd13uQjoXtEKNosOWaZqXgel0g=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
    <header>
        <div class="back">
           <a href="login.html"> <i class="fa-solid fa-arrow-left"></i></a>
        </div>
    </header>
    
    <div class="container">
        <h2 class="t-center">Sign-up</h2>
        <form action="login.html">
            <div class="inputDiv">
                <label for="name" class="username">Name</label>
                <div class="userArea">
                    <i class="fa-solid fa-user"></i><input type="text" name="name" id="name"
                        placeholder="Type your name" required>
                </div>
                <hr>
            </div>
            <div class="inputDiv">
                <label for="email" class="username">E-mail</label>
                <div class="userArea">
                    <i class="fa-solid fa-envelope"></i><input type="text" name="name" id="email"
                        placeholder="Type your E-mail" required>
                </div>
                <hr>
            </div>
            <div class="inputDiv">
                <label for="password" class="username">Password</label>
                <div class="userArea">
                    <i class="fa-solid fa-key"></i><input type="password" name="password" id="password"
                        placeholder="Type your password" required>
                </div>
                <hr>
            </div>
            <div class="inputDiv">
                <label for="password" class="username">Confirm Password</label>
                <div class="userArea">
                    <i class="fa-solid fa-key"></i><input type="password" name="password" id="password"
                        placeholder="Again type your password" required>
                </div>
                <hr>
            </div>

            
            <input id="done" class="btn" type="submit" value="Sign-up">
           
            <div class="formBottom">
                
                <p class="signUp">If already Registured</p>
               <a href="login.html"> <p id="signUp">LOG IN</p></a>
            </div>
        </form>
    </div>
    
</body>
</html>
